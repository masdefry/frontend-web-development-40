<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro CSS</title>
    <style>
      /* 
            Selector: 
            1. Tag Selector
            2. Id Selector
            3. Class Selector
        */

      /* Tag Selector */
      h2 {
        color: blue;
        background-color: gray;
      }

      /* Id Selector */
      #programming-php {
        font-size: 52px;
        color: purple;
      }

      /* Class Selector */
      .programming-golang {
        color: red;
      }

      .bg-red {
        background-color: red;
      }

      .bg-blue {
        background-color: blue;
      }

      .bg-yellow {
        background-color: yellow;
      }

      .text-xs {
        font-size: 12px;
      }

      .text-sm {
        font-size: 16px;
      }

      .text-md {
        font-size: 18px;
      }

      .text-lg {
        font-size: 24px;
      }

      #paragraph-01 {
      }

      #btn-submit {
        background-color: bisque;
      }
    </style>
    <link rel="stylesheet" href="styling.css" />
  </head>
  <body>
    <!-- Inline Style -->
    <h1 style="background-color: yellow; color: black">Javascript</h1>
    <p style="font-size: 12px; line-height: 1.5; color: bisque">
      Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aut itaque
      perferendis, doloribus odit libero ducimus ad non repellendus inventore
      reiciendis in qui ullam expedita fugit consequatur et amet deleniti eius.
    </p>

    <!-- Internal Style -->
    <h2>Typescript</h2>
    <h2>Typescript</h2>
    <h3 id="programming-php">PHP</h3>
    <h4 class="programming-golang">Golang</h4>
    <h5 class="bg-yellow text-lg">Java</h5>
    <h6 class="bg-yellow text-lg">Flutter</h6>
    <p id="paragraph-01">Hello World</p>

    <button id="btn-submit" class="btn-submit" style="background-color: yellow;">Submit</button>
  </body>
</html>
